name: "Terraform Plan Claude Review"

on:
  pull_request:

concurrency:
  group: terraform-plan-claude-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_CLOUD_ORGANIZATION: "yuzhao-terraform"
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_WORKSPACE: "learn-terraform-github-actions"
  CONFIG_DIRECTORY: "./"

  TFCTL_VERSION: "0.3.0"
  TFCTL_HOSTNAME: "app.terraform.io"
  TFCTL_ORGANIZATION: "yuzhao-terraform"
  TFCTL_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TFCTL_TELEMETRY: "disabled"

jobs:
  terraform-plan-claude:
    if: github.repository != 'hashicorp-education/learn-terraform-github-actions'
    name: "Terraform Plan Claude Review"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tfctl
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64) tfctl_arch="amd64" ;;
            aarch64|arm64) tfctl_arch="arm64" ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          tfctl_archive="tfctl_${TFCTL_VERSION}_linux_${tfctl_arch}.zip"
          tfctl_release_url="https://releases.hashicorp.com/tfctl/${TFCTL_VERSION}"

          curl --fail --silent --show-error --location \
            --output "${tfctl_archive}" \
            "${tfctl_release_url}/${tfctl_archive}"

          curl --fail --silent --show-error --location \
            --output tfctl_SHA256SUMS \
            "${tfctl_release_url}/tfctl_${TFCTL_VERSION}_SHA256SUMS"

          grep " ${tfctl_archive}$" tfctl_SHA256SUMS | sha256sum --check -

          unzip -q "${tfctl_archive}"
          sudo install -m 0755 tfctl /usr/local/bin/tfctl

          rm -f "${tfctl_archive}" tfctl_SHA256SUMS tfctl

          tfctl --version

      - name: Install tfctl skill for Claude
        shell: bash
        run: |
          set -euo pipefail

          tfctl harness install claude --global

          echo "Installed tfctl Claude skill:"
          ls -l "$HOME/.claude/skills/tfctl/SKILL.md"

      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.0.0
        id: plan-upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}
          speculative: true

      - name: Create Plan Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.0.0
        id: plan-run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.plan-upload.outputs.configuration_version_id }}
          plan_only: true

      - name: Get Plan Output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.0.0
        id: plan-output
        with:
          plan: ${{ fromJSON(steps.plan-run.outputs.payload).data.relationships.plan.data.id }}

      - name: Collect Plan Artifacts with tfctl
        shell: bash
        env:
          RUN_ID: ${{ steps.plan-run.outputs.run_id }}
          RUN_LINK: ${{ steps.plan-run.outputs.run_link }}
          PLAN_ID: ${{ fromJSON(steps.plan-run.outputs.payload).data.relationships.plan.data.id }}
          ADD_COUNT: ${{ steps.plan-output.outputs.add }}
          CHANGE_COUNT: ${{ steps.plan-output.outputs.change }}
          DESTROY_COUNT: ${{ steps.plan-output.outputs.destroy }}
        run: |
          set -euo pipefail

          mkdir -p plan-artifacts

          cat > plan-artifacts/summary.md <<EOF
          # Terraform Plan Summary

          - Organization: ${TFCTL_ORGANIZATION}
          - Workspace: ${TF_WORKSPACE}
          - Run ID: ${RUN_ID}
          - Plan ID: ${PLAN_ID}
          - Run link: ${RUN_LINK}
          - Resource changes: ${ADD_COUNT} to add, ${CHANGE_COUNT} to change, ${DESTROY_COUNT} to destroy
          EOF

          # Collect HCP Terraform run status.
          tfctl run status "${RUN_ID}" \
            --markdown \
            --no-color \
            > plan-artifacts/run-status.md

          # Collect structured Terraform plan output.
          #
          # Large plans are reduced to the actual resource/output changes
          # before they are passed to Claude.
          if tfctl api "/plans/${PLAN_ID}/json-output" \
            --no-color \
            > plan-artifacts/plan.json \
            2> plan-artifacts/plan-json-error.txt; then

            jq '{
              format_version,
              terraform_version,
              resource_changes: (.resource_changes // []),
              output_changes: (.output_changes // {})
            }' \
              plan-artifacts/plan.json \
              > plan-artifacts/plan-changes.json

            rm -f \
              plan-artifacts/plan.json \
              plan-artifacts/plan-json-error.txt
          else
            echo "Structured plan JSON unavailable; review will use run status only." >&2

            rm -f plan-artifacts/plan.json
          fi

          echo "Plan artifacts:"
          ls -la plan-artifacts

      - name: Review Plan with Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Use the installed tfctl skill when reviewing this
            HCP Terraform plan.

            You are reviewing a speculative Terraform plan for this
            pull request.

            The Terraform plan artifacts are located in:

            plan-artifacts/

            Available files:

            - summary.md
              Contains the HCP Terraform organization, workspace,
              run ID, plan ID, run link, and resource change counts.

            - run-status.md
              Contains the HCP Terraform run status, diagnostics,
              policy failures, warnings, and other run information.

            - plan-changes.json
              Contains structured Terraform resource and output
              changes. This file may be absent if structured plan
              JSON was unavailable.

            Read these files.

            Also inspect the changed .tf files in this repository
            so you can compare the Terraform code changes with the
            actual HCP Terraform plan.

            Prepare a review with this exact title:

            ## Claude Terraform Plan Review

            The review should cover:

            1. Plan Summary

               Explain in plain language what the Terraform plan
               actually changes.

            2. Risky or Destructive Changes

               Call out these items first:

               - resource deletions
               - resource replacements
               - changes that could cause downtime
               - changes that could cause data loss

               Reference specific Terraform resource addresses.

            3. Code-to-Plan Alignment

               Determine whether the Terraform plan matches the
               apparent intent of the .tf changes in this pull
               request.

               Flag anything that appears unexpected or unintended.

            4. Security and Terraform Best Practices

               Look for issues including:

               - hardcoded secrets
               - overly permissive access
               - insecure configuration
               - missing important tags
               - drift-prone configuration
               - other Terraform best-practice concerns

            5. HCP Terraform Run Health

               Report anything in run-status.md that failed,
               generated warnings, or requires attention.

            If the plan is a no-op, purely additive, or obviously
            low risk, say so clearly and keep the review concise.

            Do not modify any files.

            Do not execute Terraform apply.

            Do not execute any mutating tfctl commands.

            After completing the review, post the complete review
            as a comment on PR #${{ github.event.pull_request.number }}
            using:

            gh pr comment ${{ github.event.pull_request.number }} --body "<review>"

          claude_args: |
            --max-turns 15
            --allowedTools "Read,Glob,Grep,Bash(gh pr comment:*)"