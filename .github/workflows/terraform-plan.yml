name: "Terraform Plan"

on:
  pull_request:

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_CLOUD_ORGANIZATION: "yuzhao-terraform"
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_WORKSPACE: "learn-terraform-github-actions"
  CONFIG_DIRECTORY: "./"

  TFCTL_VERSION: "0.3.0"
  TFCTL_HOSTNAME: "app.terraform.io"
  TFCTL_ORGANIZATION: "yuzhao-terraform"
  TFCTL_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TFCTL_TELEMETRY: "disabled"

jobs:
  terraform:
    if: github.repository != 'hashicorp-education/learn-terraform-github-actions'
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tfctl
        shell: bash
        run: |
          set -euo pipefail

          case "$(uname -m)" in
            x86_64) tfctl_arch="amd64" ;;
            aarch64|arm64) tfctl_arch="arm64" ;;
            *)
              echo "Unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          tfctl_archive="tfctl_${TFCTL_VERSION}_linux_${tfctl_arch}.zip"
          tfctl_release_url="https://releases.hashicorp.com/tfctl/${TFCTL_VERSION}"

          curl --fail --silent --show-error --location \
            --output "${tfctl_archive}" \
            "${tfctl_release_url}/${tfctl_archive}"

          curl --fail --silent --show-error --location \
            --output tfctl_SHA256SUMS \
            "${tfctl_release_url}/tfctl_${TFCTL_VERSION}_SHA256SUMS"

          grep " ${tfctl_archive}$" tfctl_SHA256SUMS | sha256sum --check -

          unzip -q "${tfctl_archive}"
          sudo install -m 0755 tfctl /usr/local/bin/tfctl

          tfctl --version

      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: plan-upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}
          speculative: true

      - name: Create Plan Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: plan-run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.plan-upload.outputs.configuration_version_id }}
          plan_only: true

      - name: Verify Plan Run with tfctl
        shell: bash
        env:
          TFCTL_RUN_ID: ${{ steps.plan-run.outputs.run_id }}
        run: |
          set -euo pipefail

          echo "HCP Terraform run: ${TFCTL_RUN_ID}"

          tfctl api "/runs/${TFCTL_RUN_ID}" \
            --jq='.data.attributes | {status, "is-confirmable": .actions."is-confirmable"}' \
            --no-color

      - name: Get Plan Output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.3.2
        id: plan-output
        with:
          plan: ${{ fromJSON(steps.plan-run.outputs.payload).data.relationships.plan.data.id }}

      - name: Update PR
        uses: actions/github-script@v7
        id: plan-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' &&
                comment.body.includes('Terraform Cloud Plan Output');
            });

            const output = `#### Terraform Cloud Plan Output
               \`\`\`
               Plan: ${{ steps.plan-output.outputs.add }} to add, ${{ steps.plan-output.outputs.change }} to change, ${{ steps.plan-output.outputs.destroy }} to destroy.
               \`\`\`
               [Terraform Cloud Plan](${{ steps.plan-run.outputs.run_link }})
               `;

            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });